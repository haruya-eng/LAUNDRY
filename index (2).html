<style>
  :root{
    --bg:#E9EFF1;
    --panel:#FFFFFF;
    --panel-2:#F3F7F8;
    --ink:#16232A;
    --ink-soft:#55666D;
    --ink-faint:#8598A0;
    --line:#CBD8DB;
    --line-strong:#A9BCC0;
    --steel:#2C4652;
    --brand:#1C6E8C;
    --brand-ink:#0E4256;
    --ok:#2E8B57;
    --ok-bg:#E3F3EA;
    --warn:#C6821F;
    --warn-bg:#FBEEDD;
    --progress:#6B4FA0;
    --progress-bg:#EEE8F7;
    --broken:#C1443A;
    --broken-bg:#FBE6E4;
    --unreg:#8598A0;
    --unreg-bg:#EEF2F3;
    --shadow: 0 1px 2px rgba(22,35,42,0.06), 0 8px 24px -12px rgba(22,35,42,0.18);
    --radius: 10px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#10181C;
      --panel:#182428;
      --panel-2:#1D2B30;
      --ink:#EAF1F2;
      --ink-soft:#A9BCC0;
      --ink-faint:#7C8F94;
      --line:#2C3E44;
      --line-strong:#3C525A;
      --steel:#0D1619;
      --brand:#4FA3C4;
      --brand-ink:#BFE3F0;
      --ok:#5FBD87;
      --ok-bg:#173226;
      --warn:#E0A448;
      --warn-bg:#3A2C13;
      --progress:#A78BD6;
      --progress-bg:#2A2140;
      --broken:#E17B72;
      --broken-bg:#3B1A18;
      --unreg:#8598A0;
      --unreg-bg:#232F33;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10181C;
    --panel:#182428;
    --panel-2:#1D2B30;
    --ink:#EAF1F2;
    --ink-soft:#A9BCC0;
    --ink-faint:#7C8F94;
    --line:#2C3E44;
    --line-strong:#3C525A;
    --steel:#0D1619;
    --brand:#4FA3C4;
    --brand-ink:#BFE3F0;
    --ok:#5FBD87;
    --ok-bg:#173226;
    --warn:#E0A448;
    --warn-bg:#3A2C13;
    --progress:#A78BD6;
    --progress-bg:#2A2140;
    --broken:#E17B72;
    --broken-bg:#3B1A18;
    --unreg:#8598A0;
    --unreg-bg:#232F33;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{ font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:14px; }
  a{ color:var(--brand); }

  /* ---------- App shell ---------- */
  .app{ max-width:1180px; margin:0 auto; padding:20px 20px 64px; }

  .headerbar{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .brandmark{ display:flex; align-items:center; gap:12px; }
  .brandmark .dial{
    width:40px; height:40px; border-radius:50%;
    border:4px solid var(--steel);
    background: radial-gradient(circle at 32% 30%, var(--panel) 0%, var(--panel-2) 55%, var(--line) 100%);
    position:relative; flex:none;
  }
  .brandmark .dial::after{
    content:""; position:absolute; inset:9px; border-radius:50%;
    border:2px solid var(--line-strong);
  }
  h1{ margin:0; font-size:21px; font-weight:900; letter-spacing:.01em; line-height:1.2; }
  .sub{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); }

  .summary{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .chip{
    display:flex; align-items:center; gap:7px;
    padding:7px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); font-size:12.5px; color:var(--ink-soft);
    cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
    user-select:none;
  }
  .chip:hover{ box-shadow:var(--shadow); }
  .chip.active{ border-color:transparent; color:#fff; }
  .chip .n{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink); }
  .chip.active .n{ color:#fff; }
  .chip .dot{ width:9px; height:9px; border-radius:50%; flex:none; }

  .chip[data-status="normal"].active{ background:var(--ok); }
  .chip[data-status="adjusting"].active{ background:var(--warn); }
  .chip[data-status="stopped"].active{ background:var(--broken); }
  .chip[data-status="total"]{ cursor:default; }
  .chip[data-status="total"]:hover{ box-shadow:none; }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-bottom:16px; flex-wrap:wrap;
  }
  .tabs{ display:flex; gap:2px; background:var(--panel-2); padding:3px; border-radius:9px; border:1px solid var(--line); }
  .tab{
    border:none; background:transparent; padding:8px 14px; border-radius:7px;
    font-size:13.5px; font-weight:500; color:var(--ink-soft);
  }
  .tab.active{ background:var(--panel); color:var(--ink); box-shadow:var(--shadow); font-weight:700; }

  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; min-width:220px;
  }
  .search input{ border:none; outline:none; background:transparent; color:var(--ink); width:100%; font-size:13.5px; }
  .search svg{ flex:none; color:var(--ink-faint); }

  /* ---------- Store grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(148px,1fr)); gap:10px;
  }
  .tile{
    position:relative; text-align:left; border-radius:var(--radius);
    background:var(--panel); border:1px solid var(--line);
    padding:14px 12px 12px; display:flex; flex-direction:column; gap:10px;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .tile:hover{ transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--line-strong); }
  .tile .top{ display:flex; align-items:center; justify-content:space-between; }
  .tile .no{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); }
  .porthole{
    width:22px; height:22px; border-radius:50%; flex:none;
    border:3px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .porthole::after{ content:""; position:absolute; inset:3px; border-radius:50%; }
  .porthole.st-normal{ border-color:var(--ok); } .porthole.st-normal::after{ background:var(--ok); }
  .porthole.st-warn{ border-color:var(--warn); } .porthole.st-warn::after{ background:var(--warn); }
  .porthole.st-progress{ border-color:var(--progress); } .porthole.st-progress::after{ background:var(--progress); }
  .porthole.st-broken{ border-color:var(--broken); } .porthole.st-broken::after{ background:var(--broken); }

<body>
<div class="app" id="app">
  <div class="headerbar">
    <div class="brandmark">
      <div class="dial" aria-hidden="true"></div>
      <div>
        <h1>設備管理ボード</h1>
        <p class="sub">コインランドリー41店舗・機械の状態と修理履歴</p>
      </div>
    </div>
    <div class="summary" id="summaryChips"></div>
  </div>

  <div id="dbWarning"></div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab" data-tab="grid">店舗一覧</button>
      <button class="tab" data-tab="history">対応履歴（全店舗）</button>
      <button class="tab" data-tab="errorcodes">エラーコード表</button>
    </div>
    <div class="search" id="searchWrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="店舗名・番号で検索">
    </div>
  </div>

  <div class="legend" id="legendRow"></div>

  <div id="mainArea"></div>
</div>

<div id="printSheet"></div>

<script>
(function(){
  "use strict";

  var STORE_COUNT = 41;

  var STATUSES = {
    normal:    { label:"正常稼働",   short:"正常",     css:"st-normal", color:"var(--ok)" },
    adjusting: { label:"調整中",     short:"調整中",   css:"st-warn",   color:"var(--warn)" },
    stopped:   { label:"使用停止",   short:"使用停止", css:"st-broken", color:"var(--broken)" }
  };
  var STATUS_ORDER = ["stopped","adjusting","normal"]; // severity desc for aggregation/sorting
  var STATUS_KEYS = ["normal","adjusting","stopped"];

  // legacy data (from the previous 4-status model) still has these values stored;
  // normalize on read so old records keep displaying sensibly without a migration script.
  function normalizeStatus(s){
    if(s === "normal" || s === "adjusting" || s === "stopped") return s;
    if(s === "warn") return "adjusting";
    if(s === "progress") return "adjusting";
    if(s === "broken") return "stopped";
    return "normal";
  }

  var CASE_STATUS = {
    open:     { label:"対応中",   css:"st-progress" },
    resolved: { label:"復旧済み", css:"st-normal" }
  };

  var REPAIR_CATS = ["エラー対応","定期点検","水漏れ・給水","異音・振動","部品交換","その他"];

  /* ---------------- state ---------------- */
  var db = null;
  var storesMap = new Map();
  var machinesMap = new Map();
  var view = "grid"; // grid | history | detail
  var selectedStoreId = null;
  var searchQuery = "";
  var statusFilter = null; // for grid chip filter
  var historyStatusFilter = null;
  var historyStoreFilter = "";

  // ephemeral UI state (not persisted)
  var addingMachine = false;
  var editingMachineId = null;
  var expandedMachines = new Set();
  var addingRepairFor = null;
  var editingStoreName = false;
  var confirmDeleteMachine = null;
  var addingStore = false;
  var confirmDeleteStore = null;
  var sortMode = "order"; // order | severity
  var quickReport = null; // {storeId, machineId} when opened via QR deep link
  var quickReportDone = false;
  var errorCodesMap = new Map();
  var addingErrorCode = false;
  var editingErrorCode = null;
  var editingCaseId = null;
  var historyCaseFilter = null; // null | "open" | "resolved"

  /* ---------------- Supabase connection ---------------- */
  var SUPABASE_URL = "https://qokifxfhtddkubqwxcpw.supabase.co";
  var SUPABASE_KEY = "sb_publishable_PS1_yd3SaR2gRBcuqNx2ow_e8ctD7z0";

  var STARTER_ERROR_CODES = {
    "01": "ドア開閉エラー",
    "02": "給水エラー（水量不足）",
    "03": "排水エラー",
    "04": "温度センサーエラー",
    "05": "モーター異常",
    "22": "インバータエラー",
    "30": "扉ロック異常",
    "40": "過負荷エラー",
    "50": "コイン・料金機エラー"
  };

  function tableNameFor(name){
    return { stores:"stores", machines:"machines", errorCodes:"error_codes" }[name] || name;
  }
  function idColumnFor(name){ return name === "errorCodes" ? "code" : "id"; }

  function toDbRow(name, obj){
    var o = {};
    if(name === "stores"){
      if("name" in obj) o.name = obj.name;
      if("order" in obj) o.order_num = obj.order;
    } else if(name === "machines"){
      if("storeId" in obj) o.store_id = obj.storeId;
      if("type" in obj) o.type = obj.type;
      if("machineNo" in obj) o.machine_no = obj.machineNo;
      if("model" in obj) o.model = obj.model;
      if("serial" in obj) o.serial = obj.serial;
      if("capacityKg" in obj) o.capacity = obj.capacityKg;
      if("status" in obj) o.status = obj.status;
      if("installDate" in obj) o.install_date = obj.installDate || null;
      if("notes" in obj) o.notes = obj.notes;
      if("repairs" in obj) o.repairs = obj.repairs;
      if("updatedAt" in obj) o.updated_at = new Date(obj.updatedAt).toISOString();
      if("createdAt" in obj) o.created_at = new Date(obj.createdAt).toISOString();
    } else if(name === "errorCodes"){
      if("code" in obj) o.code = obj.code;
      if("description" in obj) o.description = obj.description;
      if("updatedAt" in obj) o.updated_at = new Date(obj.updatedAt).toISOString();
    } else {
      return obj;
    }
    return o;
  }

  function fromDbRow(name, row){
    if(!row) return row;
    if(name === "stores"){
      return { name: row.name, order: row.order_num };
    }
    if(name === "machines"){
      return {
        storeId: row.store_id, type: row.type, machineNo: row.machine_no, model: row.model,
        serial: row.serial, capacityKg: row.capacity, status: row.status, installDate: row.install_date,
        notes: row.notes, repairs: row.repairs || [],
        createdAt: row.created_at ? new Date(row.created_at).getTime() : null,
        updatedAt: row.updated_at ? new Date(row.updated_at).getTime() : null
      };
    }
    if(name === "errorCodes"){
      return { description: row.description, updatedAt: row.updated_at ? new Date(row.updated_at).getTime() : null };
    }
    return row;
  }

  var refetchers = {}; // table -> function() that re-fetches and re-renders that collection

  function makeSupabaseDbShim(client){
    function collection(name){
      var table = tableNameFor(name);
      var idCol = idColumnFor(name);
      function poke(){ if(refetchers[table]) refetchers[table](); }
      return {
        doc: function(id){
          return {
            get: async function(){
              var res = await client.from(table).select("*").eq(idCol, id).maybeSingle();
              if(res.error) throw res.error;
              return { exists: !!res.data, data: function(){ return res.data ? fromDbRow(name, res.data) : undefined; } };
            },
            set: async function(obj){
              var payload = toDbRow(name, obj);
              payload[idCol] = id;
              var res = await client.from(table).upsert(payload, { onConflict: idCol });
              if(res.error) throw res.error;
              poke();
            },
            update: async function(obj){
              var payload = toDbRow(name, obj);
              var res = await client.from(table).update(payload).eq(idCol, id);
              if(res.error) throw res.error;
              poke();
            },
            delete: async function(){
              var res = await client.from(table).delete().eq(idCol, id);
              if(res.error) throw res.error;
              poke();
            }
          };
        },
        add: async function(obj){
          var payload = toDbRow(name, obj);
          var res = await client.from(table).insert(payload).select().single();
          if(res.error) throw res.error;
          poke();
          return { id: res.data[idCol] };
        },
        list: async function(){
          var res = await client.from(table).select("*");
          if(res.error) throw res.error;
          return res.data.map(function(row){ return { id: row[idCol], data: function(){ return fromDbRow(name, row); } }; });
        },
        onSnapshot: function(onNext, onErr){
          async function fetchAll(){
            try{
              var res = await client.from(table).select("*");
              if(res.error) throw res.error;
              onNext({ docs: res.data.map(function(row){
                return { id: row[idCol], data: function(){ return fromDbRow(name, row); } };
              }) });
            }catch(e){ if(onErr) onErr(e); }
          }
          refetchers[table] = fetchAll;
          fetchAll();
          client.channel("realtime:"+table)
            .on("postgres_changes", { event:"*", schema:"public", table:table }, fetchAll)
            .subscribe();
        }
      };
    }
    return { collection: collection };
  }

  async function connectSupabase(){
    if(!window.supabase || !window.supabase.createClient){
      throw new Error("supabase-js library failed to load");
    }
    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return makeSupabaseDbShim(client);
  }

  /* ---------------- boot ---------------- */
  document.addEventListener("DOMContentLoaded", init);

  async function init(){
    wireStaticEvents();
    try{
      var params = new URLSearchParams(location.search);
      var qStore = params.get("store");
      var qMachine = params.get("machine");
      if(qMachine){
        quickReport = { storeId: qStore, machineId: qMachine };
        view = "quickreport";
      } else if(qStore){
        selectedStoreId = qStore;
        view = "detail";
      }
    }catch(e){ /* ignore malformed url */ }
    render();
    try{
      db = await connectSupabase();
    }catch(e){ console.error("supabase connect error", e); db = null; }
    if(!db){
      showDbWarning();
      return;
    }
    subscribeStores();
    subscribeMachines();
    subscribeErrorCodes();
    seedIfNeeded();
    seedErrorCodesIfNeeded();
  }

  function showDbWarning(){
    document.getElementById("dbWarning").innerHTML =
      '<div class="db-warning">データベースに接続できませんでした。表示のみのモードで動作しています。しばらくしてページを開き直してください。</div>';
  }

  function pad2(n){ return String(n).padStart(2,"0"); }

  async function seedIfNeeded(){
    try{
      var docs = await db.collection("stores").list();
      if(docs && docs.length > 0) return;
      for(var i=1;i<=STORE_COUNT;i++){
        await db.collection("stores").add({ name: "店舗"+pad2(i), order: i });
      }
    }catch(e){ console.error("seed error", e); }
  }

  async function seedErrorCodesIfNeeded(){
    try{
      var docs = await db.collection("errorCodes").list();
      if(docs && docs.length > 0) return;
      var codes = Object.keys(STARTER_ERROR_CODES);
      for(var i=0;i<codes.length;i++){
        var code = codes[i];
        await db.collection("errorCodes").doc(code).set({ code: code, description: STARTER_ERROR_CODES[code], updatedAt: Date.now() });
      }
    }catch(e){ console.error("errorCodes seed error", e); }
  }

  function subscribeStores(){
    db.collection("stores").onSnapshot(function(snap){
      var m = new Map();
      snap.docs.forEach(function(d){ m.set(d.id, Object.assign({id:d.id}, d.data())); });
      storesMap = m;
      render();
    }, function(err){ console.error("stores sub error", err); });
  }

  function subscribeMachines(){
    db.collection("machines").onSnapshot(function(snap){
      var m = new Map();
      snap.docs.forEach(function(d){ m.set(d.id, Object.assign({id:d.id}, d.data())); });
      machinesMap = m;
      render();
    }, function(err){ console.error("machines sub error", err); });
  }

  function subscribeErrorCodes(){
    db.collection("errorCodes").onSnapshot(function(snap){
      var m = new Map();
      snap.docs.forEach(function(d){ m.set(d.id, Object.assign({code:d.id}, d.data())); });
      errorCodesMap = m;
      if(view === "errorcodes") renderErrorCodes();
    }, function(err){ console.error("errorCodes sub error", err); });
  }

  /* ---------------- data helpers ---------------- */

  function storesSorted(){
    var arr = Array.from(storesMap.values());
    arr.sort(function(a,b){ return (a.order||0) - (b.order||0); });
    return arr;
  }

  function severityRank(storeId){
    var agg = storeAggregateStatus(storeId);
    if(agg === null) return 99; // unregistered sinks to the bottom
    return STATUS_ORDER.indexOf(agg); // broken=0 ... normal=3
  }

  function storesSortedForGrid(){
    var arr = storesSorted();
    if(sortMode === "severity"){
      arr = arr.slice().sort(function(a,b){
        var r = severityRank(a.id) - severityRank(b.id);
        if(r !== 0) return r;
        return (a.order||0) - (b.order||0);
      });
    }
    return arr;
  }

  function machinesForStore(storeId){
    var arr = [];
    machinesMap.forEach(function(m){ if(m.storeId === storeId) arr.push(m); });
    arr.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
    return arr;
  }

  function storeAggregateStatus(storeId){
    var machines = machinesForStore(storeId);
    if(machines.length === 0) return null;
    var worst = null;
    machines.forEach(function(m){
      var st = normalizeStatus(m.status);
      if(worst === null || STATUS_ORDER.indexOf(st) < STATUS_ORDER.indexOf(worst)) worst = st;
    });
    return worst;
  }

  function statusCounts(){
    var counts = { normal:0, adjusting:0, stopped:0 };
    machinesMap.forEach(function(m){
      counts[normalizeStatus(m.status)]++;
    });
    return counts;
  }

  function fmtDate(ts){
    if(!ts) return "";
    if(typeof ts === "string") return ts;
    var d = new Date(ts);
    return d.getFullYear()+"/"+pad2(d.getMonth()+1)+"/"+pad2(d.getDate());
  }

  function fmtDateTime(v){
    if(!v) return "";
    if(typeof v === "string" && v.indexOf("T") > -1){
      var parts = v.split("T");
      return parts[0].replace(/-/g,"/") + " " + parts[1];
    }
    return fmtDate(v);
  }

  function nowLocalDatetime(){
    var d = new Date();
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes());
  }

  function escapeHtml(s){
    if(s === undefined || s === null) return "";
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function genId(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

  function typeIcon(type){
    var t = String(type||"");
    if(t.indexOf("乾燥")>-1 && t.indexOf("洗濯")===-1) return iconDryer;
    return iconWasher;
  }
  function typeLabel(m){
    return m && m.type ? m.type : "機械";
  }

  function machineLabelPlain(m){
    var name = (m.model || typeLabel(m) || "");
    return m.machineNo ? ("No."+m.machineNo+" "+name) : name;
  }
  function machineNoBadge(m){
    return m.machineNo ? ('<span class="store-tag">No.'+escapeHtml(m.machineNo)+'</span>') : "";
  }

  async function applyCaseUpdate(machineId, entryData, isNew, caseId){
    var m = machinesMap.get(machineId);
    var repairs = (m && Array.isArray(m.repairs)) ? m.repairs.slice() : [];
    if(isNew){
      entryData = Object.assign({ id: genId(), createdAt: Date.now() }, entryData);
      repairs.unshift(entryData);
    } else {
      var idx = repairs.findIndex(function(r){ return r.id === caseId; });
      if(idx > -1){
        repairs[idx] = Object.assign({}, repairs[idx], entryData);
      } else {
        repairs.unshift(Object.assign({ id: genId(), createdAt: Date.now() }, entryData));
      }
    }
    await db.collection("machines").doc(machineId).update({
      repairs: repairs, status: entryData.resultStatus, updatedAt: Date.now()
    });
  }

  /* ---------------- render ---------------- */

  function render(){
    var isQuick = (view === "quickreport");
    document.querySelector(".headerbar").style.display = isQuick ? "none" : "flex";
    document.getElementById("dbWarning").style.display = isQuick ? "none" : "block";
    document.querySelector(".toolbar").style.display = isQuick ? "none" : "flex";

    if(isQuick){
      renderQuickReport();
      return;
    }
    renderSummary();
    renderLegend();
    renderTabs();
    if(view === "detail" && selectedStoreId){
      renderDetail();
    } else if(view === "history"){
      renderHistory();
    } else if(view === "errorcodes"){
      renderErrorCodes();
    } else {
      renderGrid();
    }
  }

  function renderLegend(){
    var html = STATUS_KEYS.map(function(k){
      return '<span><span class="d" style="background:'+STATUSES[k].color+'"></span>'+STATUSES[k].label+'</span>';
    }).join("") + '<span><span class="d" style="background:var(--line)"></span>未登録（機械なし）</span>';
    document.getElementById("legendRow").innerHTML = html;
  }

  function renderTabs(){
    document.querySelectorAll(".tab").forEach(function(t){
      var tv = t.getAttribute("data-tab");

    });

    wrap.style.display = (view === "history" || view === "errorcodes") ? "none" : "flex";
  }

  function renderSummary(){
    var counts = statusCounts();
    var total = counts.normal + counts.adjusting + counts.stopped;
    var chips = [
      '<div class="chip" data-status="total"><span class="n">'+total+'</span>台 / '+storesMap.size+'店舗</div>'
    ];
    STATUS_KEYS.forEach(function(k){
      var active = statusFilter === k;
      chips.push(
        '<button class="chip'+(active?" active":"")+'" data-status="'+k+'" data-action="filter-status">'+
          '<span class="dot" style="background:'+STATUSES[k].color+'"></span>'+
          '<span class="n">'+counts[k]+'</span>'+STATUSES[k].short+
        '</button>'
      );
    });
    document.getElementById("summaryChips").innerHTML = chips.join("");
  }

  function renderGrid(){
    var q = searchQuery.trim().toLowerCase();
    var stores = storesSortedForGrid();
    var html = stores.map(function(s){
      var agg = storeAggregateStatus(s.id);
      var cssClass = agg ? STATUSES[agg].css : "st-unreg";
      var portholeClass = agg ? STATUSES[agg].css : "st-unreg";
      var machines = machinesForStore(s.id);
      var counts = { normal:0, adjusting:0, stopped:0 };
      machines.forEach(function(m){ counts[normalizeStatus(m.status)]++; });

      var matchesSearch = !q || s.name.toLowerCase().indexOf(q) !== -1 || s.id.indexOf(q) !== -1 || ("店舗"+pad2(s.order)).indexOf(q) !== -1;
      var matchesFilter = !statusFilter || (agg === statusFilter);
      var dim = !(matchesSearch && matchesFilter);

      var metaParts = [];
      if(machines.length){
        STATUS_KEYS.forEach(function(k){ if(counts[k]) metaParts.push('<b>'+counts[k]+'</b>'+STATUSES[k].short); });
      } else {
        metaParts.push("未登録");
      }

      return '<button class="tile '+cssClass+(dim?" dim":"")+'" data-action="open-store" data-id="'+s.id+'">'+
        '<div class="top"><span class="no">No.'+pad2(s.order)+'</span><span class="porthole '+portholeClass+'"></span></div>'+
        '<div class="name">'+escapeHtml(s.name)+'</div>'+
        '<div class="meta">'+(machines.length? machines.length+"台・":"") + metaParts.join(" ")+'</div>'+
      '</button>';
    }).join("");

    var toolbarRow = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">'+
      '<div class="sort-toggle">'+
        '<button data-action="set-sort" data-sort="order" class="'+(sortMode==="order"?"active":"")+'">店番順</button>'+
        '<button data-action="set-sort" data-sort="severity" class="'+(sortMode==="severity"?"active":"")+'">状態が悪い順</button>'+
      '</div>'+
      '<button class="btn primary" data-action="toggle-add-store">＋ 店舗を追加</button>'+
    '</div>';

    var addStoreForm = "";
    if(addingStore){
      addStoreForm = '<div class="panel">'+
        '<h3>店舗を追加</h3>'+
        '<div class="form-grid">'+
          field("店舗名","name","text", null, "") +
        '</div>'+
        '<div class="form-actions">'+
          '<button class="btn ghost" data-action="cancel-store-form">キャンセル</button>'+
          '<button class="btn primary" data-action="save-store">追加する</button>'+
        '</div>'+
      '</div>';
    }

    var gridHtml = stores.length ? ('<div class="grid">'+html+'</div>') : '<div class="empty-note">店舗が登録されていません。「＋ 店舗を追加」から登録してください。</div>';

    document.getElementById("mainArea").innerHTML = toolbarRow + addStoreForm + gridHtml;
    var storeNameInput = document.querySelector('#mainArea .panel input[data-field="name"]');
    if(storeNameInput) storeNameInput.focus();
  }

    var head =
      '<button class="backbtn" data-action="back-to-grid">'+
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>'+

  function field(label, name, type, options, value, placeholder){
    var inner;

      inner = '<select data-field="'+name+'">' + options.map(function(o){
        return '<option value="'+o.v+'"'+(o.v===value?" selected":"")+'>'+o.l+'</option>';
      }).join("") + '</select>';
    } else {
      inner = '<input type="'+type+'" data-field="'+name+'" value="'+escapeHtml(value)+'"'+(placeholder?' placeholder="'+escapeHtml(placeholder)+'"':'')+'>';
    }
    return '<div class="field"><label>'+label+'</label>'+inner+'</div>';
  }

  function buildMachineUrl(storeId, machineId){

  function renderQrInto(elId, text, size){
    var el = document.getElementById(elId);
    if(!el) return;
    el.innerHTML = "";
    if(window.QRCode){
      try{ new QRCode(el, { text: text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); }
      catch(e){ el.innerHTML = '<div style="font-size:10px;color:#333;padding:8px;max-width:'+size+'px;word-break:break-all;">'+escapeHtml(text)+'</div>'; }
    } else {
      el.innerHTML = '<div style="font-size:10px;color:#333;padding:8px;max-width:'+size+'px;word-break:break-all;">'+escapeHtml(text)+'</div>';
    }
  }

      '<div class="modal qr-modal">'+

        '<p style="margin:0;font-size:12.5px;color:var(--ink-soft);">スキャンするとこの機械の報告ページが直接開きます。印刷して機械に貼り付けてください。</p>'+
        '<div class="qr-box" id="qrModalBox"></div>'+
        '<div class="qr-label">'+
          '<div class="n1">'+escapeHtml(store ? store.name : "")+'</div>'+
          '<div class="n2">'+escapeHtml(machineLabelPlain(m))+'</div>'+
          (m.serial ? '<div class="n3">S/N '+escapeHtml(m.serial)+'</div>' : '')+
        '</div>'+
        '<div class="actions">'+
          '<button class="btn ghost" id="qrCloseBtn">閉じる</button>'+
          '<button class="btn primary" id="qrPrintBtn">印刷する</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener("click", function(e){ if(e.target === wrap) close(); });
    document.getElementById("qrCloseBtn").addEventListener("click", close);
    document.getElementById("qrPrintBtn").addEventListener("click", function(){
      buildPrintSheet([{ store: store, machine: m }]);
      setTimeout(function(){ window.print(); }, 60);
    });
    renderQrInto("qrModalBox", url, 180);
    function close(){ wrap.remove(); }
  }

  function buildPrintSheet(items){
    var html = items.map(function(it, idx){
      return '<div class="print-tag">'+
        '<div class="qr-box" id="printQr'+idx+'"></div>'+
        '<div class="n1">'+escapeHtml(it.store ? it.store.name : "")+'</div>'+
        '<div class="n2">'+escapeHtml(machineLabelPlain(it.machine))+'</div>'+
        (it.machine.serial ? '<div class="n3">S/N '+escapeHtml(it.machine.serial)+'</div>' : '')+
      '</div>';
    }).join("");
    var sheet = document.getElementById("printSheet");
    sheet.innerHTML = html;
    items.forEach(function(it, idx){
      renderQrInto("printQr"+idx, buildMachineUrl(it.machine.storeId, it.machine.id), 130);
    });
  }

  function dbEverLoaded(){ return storesMap.size > 0 || machinesMap.size > 0; }

  function renderHistory(){
    var rows = [];
    machinesMap.forEach(function(m){
      var store = storesMap.get(m.storeId);
      var repairs = Array.isArray(m.repairs) ? m.repairs : [];
      repairs.forEach(function(r){
        rows.push({
          storeName: store ? store.name : "（不明な店舗）",
          storeId: m.storeId,
          machineId: m.id,
          machineLabel: machineLabelPlain(m),
          serial: m.serial,
          r: r
        });
      });
    });
    rows.sort(function(a,b){ return (b.r.createdAt||0) - (a.r.createdAt||0); });

    var filtered = rows.filter(function(row){
      var okStatus = !historyStatusFilter || normalizeStatus(row.r.resultStatus) === historyStatusFilter;
      var okStore = !historyStoreFilter || row.storeId === historyStoreFilter;
      var okCase = !historyCaseFilter || (row.r.caseStatus || "open") === historyCaseFilter;
      return okStatus && okStore && okCase;
    });

    var storeOptions = storesSorted().map(function(s){
      return '<option value="'+s.id+'"'+(historyStoreFilter===s.id?" selected":"")+'>'+escapeHtml(s.name)+'</option>';
    }).join("");

    var filters =
      '<div class="history-filters">'+
        '<select id="historyStoreSelect" class="btn small" style="padding:8px 10px;">'+
          '<option value="">すべての店舗</option>'+storeOptions+
        '</select>'+
        STATUS_KEYS.map(function(k){
          var active = historyStatusFilter === k;
          return '<button class="chip'+(active?" active":"")+'" data-status="'+k+'" data-action="filter-history-status">'+
            '<span class="dot" style="background:'+STATUSES[k].color+'"></span>'+STATUSES[k].label+'</button>';
        }).join("")+
      '</div>'+
      '<div class="history-filters">'+
        Object.keys(CASE_STATUS).map(function(k){
          var active = historyCaseFilter === k;
          return '<button class="chip'+(active?" active":"")+'" data-case="'+k+'" data-action="filter-history-case">'+
            '<span class="dot" style="background:'+(k==="open"?"var(--progress)":"var(--ok)")+'"></span>'+CASE_STATUS[k].label+'</button>';
        }).join("")+
      '</div>';

    var listHtml;
    if(filtered.length === 0){
      listHtml = '<div class="empty-note">該当する対応履歴がありません。</div>';
    } else {
      listHtml = '<div class="repair-list">' + filtered.map(renderHistoryItem).join("") + '</div>';
    }

    document.getElementById("mainArea").innerHTML = filters + listHtml;
    var sel = document.getElementById("historyStoreSelect");
    if(sel) sel.addEventListener("change", function(){ historyStoreFilter = sel.value; renderHistory(); });
  }

  function renderHistoryItem(row){
    var r = row.r;
    var statusInfo = STATUSES[normalizeStatus(r.resultStatus)];
    var caseInfo = r.caseStatus ? CASE_STATUS[r.caseStatus] : null;
    var dateLabel = r.date ? fmtDate(r.date) : fmtDate(r.createdAt);
    var lines = [];
    if(r.vendorName) lines.push('<span>業者: '+escapeHtml(r.vendorName)+'</span>');
    if(r.handledBy) lines.push('<span>担当: '+escapeHtml(r.handledBy)+'</span>');
    if(r.visitedAt) lines.push('<span>訪問日: '+escapeHtml(fmtDate(r.visitedAt))+'</span>');
    if(r.resolvedAt) lines.push('<span>復旧: '+escapeHtml(fmtDateTime(r.resolvedAt))+'</span>');
    if(r.cost) lines.push('<span>費用: ¥'+Number(r.cost).toLocaleString()+'</span>');

    return '<div class="repair-item">'+
      '<div class="r-top">'+
        '<span class="r-date mono">'+escapeHtml(dateLabel)+'</span>'+
        (caseInfo? '<span class="badge '+caseInfo.css+'">'+caseInfo.label+'</span>':'')+
        (statusInfo? '<span class="badge '+statusInfo.css+'">'+statusInfo.label+'</span>':'')+
      '</div>'+
      '<div class="m-sub" style="margin:6px 0;"><b>'+escapeHtml(row.storeName)+'</b> ・ '+escapeHtml(row.machineLabel)+(row.serial? ' ・ <span class="mono">S/N '+escapeHtml(row.serial)+'</span>':'')+' ・ '+escapeHtml(r.category||"")+(r.errorCode? ' ・ エラー番号 '+escapeHtml(r.errorCode):'')+'</div>'+
      (r.errorDescription? '<div class="r-desc"><b>'+escapeHtml(r.errorDescription)+'</b></div>':'')+
      ((r.responseNotes||r.description)? '<div class="r-desc">'+escapeHtml(r.responseNotes||r.description)+'</div>':'')+
      (lines.length? '<div class="r-foot">'+lines.join("")+'</div>':'')+
      '<div class="form-actions" style="margin-top:8px;"><button class="btn small ghost" data-action="goto-case" data-store="'+row.storeId+'" data-machine="'+row.machineId+'" data-case="'+r.id+'">対応する／編集</button></div>'+
    '</div>';
  }

    var toolbarRow = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'+
      '<p style="font-size:12.5px;color:var(--ink-soft);margin:0;max-width:520px;">エラー番号と内容を登録しておくと、店舗がQRからエラー番号を報告した際に自動で内容が記録されます。</p>'+
      '<button class="btn primary" data-action="toggle-add-errorcode">＋ エラーコードを追加</button>'+
    '</div>';

    var formHtml = "";
    if(addingErrorCode){
      formHtml = '<div class="panel"><h3>エラーコードを追加</h3><div class="form-grid">'+
        field("エラー番号","code","text", null, "") +
        field("エラー内容","description","text", null, "") +
        '</div><div class="form-actions">'+
          '<button class="btn ghost" data-action="cancel-errorcode-form">キャンセル</button>'+
          '<button class="btn primary" data-action="save-errorcode">追加する</button>'+
        '</div></div>';
    }

    var listHtml;
    if(codes.length === 0){
      listHtml = '<div class="empty-note">エラーコードが登録されていません。</div>';
    } else {
      listHtml = '<div class="machine-list">' + codes.map(function(c){
        if(editingErrorCode === c.code){
          return '<div class="machine-card"><div class="panel" style="margin:0;border:none;box-shadow:none;">'+
            '<div class="form-grid">'+
              field("エラー番号","code","text", null, c.code) +
              field("エラー内容","description","text", null, c.description||"") +
            '</div>'+
            '<div class="form-actions">'+
              '<button class="btn ghost" data-action="cancel-errorcode-form">キャンセル</button>'+
              '<button class="btn primary" data-action="save-errorcode" data-original-code="'+escapeHtml(c.code)+'">保存する</button>'+
            '</div>'+
          '</div></div>';
        }
        return '<div class="machine-card"><div class="machine-row" style="cursor:default;">'+
          '<div class="machine-info"><div class="m-title"><span class="store-tag mono">No.'+escapeHtml(c.code)+'</span> '+escapeHtml(c.description || "（内容未登録）")+'</div></div>'+
          '<div class="machine-actions">'+
            '<button class="icon-btn" data-action="edit-errorcode" data-code="'+escapeHtml(c.code)+'" title="編集">'+iconPencil()+'</button>'+
            '<button class="icon-btn" data-action="delete-errorcode" data-code="'+escapeHtml(c.code)+'" title="削除">'+iconTrash()+'</button>'+
          '</div>'+
        '</div></div>';
      }).join("") + '</div>';

    document.getElementById("mainArea").innerHTML = toolbarRow + formHtml + listHtml;

  /* ---------------- events ---------------- */

  function wireStaticEvents(){
    document.getElementById("searchInput").addEventListener("input", function(e){
      searchQuery = e.target.value;
      if(view === "grid") renderGrid();
    });

    document.getElementById("app").addEventListener("click", handleClick);
  }

  function readFormValues(panelEl){
    var out = {};
    panelEl.querySelectorAll("[data-field]").forEach(function(el){
      out[el.getAttribute("data-field")] = el.value;
    });
    return out;
  }

  async function handleClick(e){
    var target = e.target.closest("[data-action]");
    if(!target) {
      // tab clicks
      var tabEl = e.target.closest(".tab");
      if(tabEl){
        view = tabEl.getAttribute("data-tab");
        if(view !== "detail") selectedStoreId = null;
        render();
      }
      return;
    }
    var action = target.getAttribute("data-action");

    if(action === "open-store"){
      selectedStoreId = target.getAttribute("data-id");
      view = "detail";
      addingMachine = false; editingMachineId = null; expandedMachines = new Set(); addingRepairFor = null; editingCaseId = null;
      render();
      return;
    }
    if(action === "back-to-grid"){
      view = "grid"; selectedStoreId = null; render(); return;
    }
    if(action === "filter-status"){
      var s = target.getAttribute("data-status");
      statusFilter = (statusFilter === s) ? null : s;
      renderSummary(); renderGrid();
      return;
    }
    if(action === "filter-history-status"){
      var hs = target.getAttribute("data-status");
      historyStatusFilter = (historyStatusFilter === hs) ? null : hs;
      renderHistory();
      return;
    }
    if(action === "filter-history-case"){
      var hc = target.getAttribute("data-case");
      historyCaseFilter = (historyCaseFilter === hc) ? null : hc;
      renderHistory();
      return;
    }
    if(action === "toggle-add-machine"){
      addingMachine = !addingMachine;
      editingMachineId = null;
      renderDetail();
      return;
    }
    if(action === "cancel-machine-form"){
      addingMachine = false; editingMachineId = null; renderDetail();
      return;
    }
    if(action === "show-qr"){
      showQrModal(target.getAttribute("data-id"));
      return;
    }
    if(action === "print-qr-sheet"){
      var pStoreId = target.getAttribute("data-id");
      var pStore = storesMap.get(pStoreId);
      var pMachines = machinesForStore(pStoreId);
      buildPrintSheet(pMachines.map(function(m){ return { store: pStore, machine: m }; }));
      setTimeout(function(){ window.print(); }, 80);
      return;
    }
    if(action === "edit-machine"){
      editingMachineId = target.getAttribute("data-id");
      addingMachine = false;
      renderDetail();
      return;
    }
    if(action === "toggle-machine"){
      var mid = target.getAttribute("data-id");
      if(expandedMachines.has(mid)) expandedMachines.delete(mid); else expandedMachines.add(mid);
      renderDetail();
      return;
    }
    if(action === "toggle-repair-form"){
      addingRepairFor = target.getAttribute("data-id");
      renderDetail();
      return;
    }
    if(action === "cancel-repair-form"){
      addingRepairFor = null; renderDetail();
      return;
    }
    if(action === "edit-case"){
      editingCaseId = target.getAttribute("data-case-id");
      addingRepairFor = null;
      renderDetail();
      return;
    }
    if(action === "cancel-case-form"){
      editingCaseId = null;
      renderDetail();
      return;
    }
    if(action === "goto-case"){
      selectedStoreId = target.getAttribute("data-store");
      view = "detail";
      var gmid = target.getAttribute("data-machine");
      expandedMachines = new Set([gmid]);
      editingCaseId = target.getAttribute("data-case");
      addingMachine = false; editingMachineId = null; addingRepairFor = null;
      render();
      return;
    }
    if(action === "toggle-add-errorcode"){
      addingErrorCode = !addingErrorCode;
      editingErrorCode = null;
      renderErrorCodes();
      return;
    }
    if(action === "cancel-errorcode-form"){
      addingErrorCode = false; editingErrorCode = null;
      renderErrorCodes();
      return;
    }
    if(action === "edit-errorcode"){
      editingErrorCode = target.getAttribute("data-code");
      addingErrorCode = false;
      renderErrorCodes();
      return;
    }
    if(action === "delete-errorcode"){
      var delCode = target.getAttribute("data-code");
      if(!db) return;
      if(!confirm("エラーコード「"+delCode+"」を削除しますか？")) return;
      try{ await db.collection("errorCodes").doc(delCode).delete(); }
      catch(err){ console.error(err); alert("削除に失敗しました。"); }
      renderErrorCodes();
      return;
    }
    if(action === "save-errorcode"){
      var ecPanel = target.closest(".panel");
      var ecVals = readFormValues(ecPanel);
      var newCode = (ecVals.code || "").trim();
      var newDesc = (ecVals.description || "").trim();
      if(!newCode){ alert("エラー番号を入力してください。"); return; }
      if(!db) return;
      var originalCode = target.getAttribute("data-original-code");
      try{
        if(originalCode && originalCode !== newCode){
          await db.collection("errorCodes").doc(originalCode).delete();
        }
        await db.collection("errorCodes").doc(newCode).set({ code: newCode, description: newDesc, updatedAt: Date.now() });
      }catch(err){ console.error(err); alert("保存に失敗しました。"); }
      addingErrorCode = false; editingErrorCode = null;
      renderErrorCodes();
      return;
    }
    if(action === "open-full-app"){
      view = "grid"; selectedStoreId = null; quickReport = null;
      try{ history.replaceState(null, "", location.pathname); }catch(e){}
      render();
      return;
    }
    if(action === "save-quick-error"){
      var eqPanel = target.closest(".quick-card");
      var eqVals = readFormValues(eqPanel);
      var eqMachineId = target.getAttribute("data-id");
      var errCode = (eqVals.errorCode || "").trim();
      if(!errCode){ alert("エラー番号を入力してください。"); return; }
      if(!db) return;
      var codeInfo = errorCodesMap.get(errCode);
      var entryData = {
        date: new Date().toISOString().slice(0,10),
        category: "エラー対応",
        errorCode: errCode,
        errorDescription: codeInfo ? (codeInfo.description || "") : "",
        vendorName: "", vendorContactedAt: "", visitScheduledAt: "", visitedAt: "",
        responseNotes: "", handledBy: "", notes: eqVals.notes || "",
        resultStatus: "adjusting",
        caseStatus: "open",
        resolvedAt: null
      };
      try{
        await applyCaseUpdate(eqMachineId, entryData, true, null);
        quickReportDone = true;
      }catch(err){ console.error(err); alert("報告の送信に失敗しました。もう一度お試しください。"); }
      render();
      return;
    }
    if(action === "set-sort"){
      sortMode = target.getAttribute("data-sort");
      renderGrid();
      return;
    }
    if(action === "toggle-add-store"){
      addingStore = !addingStore;
      renderGrid();
      return;
    }
    if(action === "cancel-store-form"){
      addingStore = false;
      renderGrid();
      return;
    }
    if(action === "save-store"){
      var storePanel = target.closest(".panel");
      var storeVals = readFormValues(storePanel);
      var storeName = (storeVals.name || "").trim();
      if(!storeName){ alert("店舗名を入力してください。"); return; }
      if(!db){ return; }
      var maxOrder = 0;
      storesMap.forEach(function(s){ if((s.order||0) > maxOrder) maxOrder = s.order; });
      try{
        await db.collection("stores").add({ name: storeName, order: maxOrder + 1 });
      }catch(err){ console.error(err); alert("店舗の追加に失敗しました。"); }
      addingStore = false;
      renderGrid();
      return;
    }
    if(action === "delete-store"){
      confirmDeleteStore = target.getAttribute("data-id");
      showDeleteStoreConfirm();
      return;
    }
    if(action === "delete-machine"){
      confirmDeleteMachine = target.getAttribute("data-id");
      showDeleteConfirm();
      return;
    }
    if(action === "save-machine"){
      var panel = target.closest(".panel");
      var vals = readFormValues(panel);
      var id = target.getAttribute("data-id");
      var payload = {
        type: vals.type, machineNo: vals.machineNo||"", model: vals.model||"", serial: vals.serial||"",
        capacityKg: vals.capacityKg || "",
        status: vals.status || "normal", installDate: vals.installDate||"", notes: vals.notes||"",
        updatedAt: Date.now()
      };
      if(!db){ return; }
      try{
        if(id){
          await db.collection("machines").doc(id).update(payload);
        } else {
          payload.storeId = selectedStoreId;
          payload.repairs = [];
          payload.createdAt = Date.now();
          await db.collection("machines").add(payload);
        }
      }catch(err){ console.error(err); alert("保存に失敗しました。もう一度お試しください。"); }
      addingMachine = false; editingMachineId = null;
      renderDetail();
      return;
    }
    if(action === "save-case"){
      var cPanel = target.closest(".panel");
      var cVals = readFormValues(cPanel);
      var cMachineId = target.getAttribute("data-machine-id");
      var cCaseId = target.getAttribute("data-case-id");
      if(!db){ return; }
      var resultStatus = cVals.resultStatus || "adjusting";
      var isResolving = (resultStatus === "normal");
      var entryData = {
        date: cVals.date || new Date().toISOString().slice(0,10),
        category: cVals.category || "",
        errorCode: cVals.errorCode || "",
        errorDescription: cVals.errorDescription || "",
        vendorName: cVals.vendorName || "",
        vendorContactedAt: cVals.vendorContactedAt || "",
        visitScheduledAt: cVals.visitScheduledAt || "",
        visitedAt: cVals.visitedAt || "",
        responseNotes: cVals.responseNotes || "",
        handledBy: cVals.handledBy || "",
        notes: cVals.notes || "",
        resultStatus: resultStatus,
        caseStatus: isResolving ? "resolved" : "open",
        resolvedAt: cVals.resolvedAt || (isResolving ? nowLocalDatetime() : null)
      };
      try{
        await applyCaseUpdate(cMachineId, entryData, !cCaseId, cCaseId || null);
      }catch(err){ console.error(err); alert("保存に失敗しました。もう一度お試しください。"); }
      addingRepairFor = null; editingCaseId = null;
      renderDetail();
      return;
    }
  }

  function showDeleteConfirm(){
    var m = machinesMap.get(confirmDeleteMachine);
    var label = m ? machineLabelPlain(m) : "この機械";
    var wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML =
      '<div class="modal">'+
        '<h3 style="margin:0 0 6px;font-size:15px;">機械を削除しますか？</h3>'+
        '<p>「'+escapeHtml(label)+'」と、その修理履歴をすべて削除します。この操作は取り消せません。</p>'+
        '<div class="actions">'+
          '<button class="btn ghost" id="cancelDelete">キャンセル</button>'+
          '<button class="btn danger" id="confirmDelete">削除する</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener("click", function(e){ if(e.target === wrap) closeModal(); });
    document.getElementById("cancelDelete").addEventListener("click", closeModal);
    document.getElementById("confirmDelete").addEventListener("click", async function(){
      var id = confirmDeleteMachine;
      closeModal();
      if(db && id){
        try{ await db.collection("machines").doc(id).delete(); }
        catch(err){ console.error(err); alert("削除に失敗しました。"); }
      }
      renderDetail();
    });
    function closeModal(){ wrap.remove(); confirmDeleteMachine = null; }
  }

  function showDeleteStoreConfirm(){
    var s = storesMap.get(confirmDeleteStore);
    var machines = machinesForStore(confirmDeleteStore);
    var label = s ? s.name : "この店舗";
    var wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML =
      '<div class="modal">'+
        '<h3 style="margin:0 0 6px;font-size:15px;">店舗を削除しますか？</h3>'+
        '<p>「'+escapeHtml(label)+'」を削除します。'+(machines.length? '登録されている機械 '+machines.length+'台と、その修理履歴もすべて削除されます。' : '')+'この操作は取り消せません。</p>'+
        '<div class="actions">'+
          '<button class="btn ghost" id="cancelDeleteStore">キャンセル</button>'+
          '<button class="btn danger" id="confirmDeleteStore">削除する</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener("click", function(e){ if(e.target === wrap) closeModal(); });
    document.getElementById("cancelDeleteStore").addEventListener("click", closeModal);
    document.getElementById("confirmDeleteStore").addEventListener("click", async function(){
      var id = confirmDeleteStore;
      closeModal();
      if(db && id){
        try{
          var toDelete = machinesForStore(id);
          for(var i=0;i<toDelete.length;i++){
            await db.collection("machines").doc(toDelete[i].id).delete();
          }
          await db.collection("stores").doc(id).delete();
        }catch(err){ console.error(err); alert("削除に失敗しました。"); }
      }
      view = "grid"; selectedStoreId = null;
      render();
    });
    function closeModal(){ wrap.remove(); confirmDeleteStore = null; }
  }

  async function onStoreNameBlur(e){
    var input = e.target;
    var id = input.getAttribute("data-id");
    var value = input.value.trim();
    if(!value || !db) { return; }
    var current = storesMap.get(id);
    if(current && current.name === value) return;
    try{ await db.collection("stores").doc(id).update({ name: value }); }
    catch(err){ console.error(err); }
  }

})();
</script>
</body>
</html>
